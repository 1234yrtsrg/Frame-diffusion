dataset:
  name: express4d_condition
  root: dataset/Express4D
  data_dir: data
  data_dirs: [express4d]
  balance_base_condition: 1
  train_list: express4d_train.txt
  test_list: express4d_test.txt
  split_seed: 1
  split_ratios: [0.8, 0.2]
  fps: 60
  num_features: 52
  seq_len: 12
  num_middle: 10
  window_stride: 5
  condition_gaps:
    1: 240
    2: 120
    3: 24
    4: 12
  condition_ratios:
    1: 0.4
    2: 0.1
    3: 0.4
    4: 0.1
  use_npy_first: true
  clamp: true
  clamp_min: 0.0
  clamp_max: 1.0

train:
  epochs: 100
  batch_size: 1536
  lr: 1.0e-3
  itr_per_epoch: 1.0e+8
  valid_epoch_interval: 20
  num_workers: 0
  save_interval_steps: 10000

diffusion:
  layers: 4
  channels: 64
  nheads: 8
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.5
  num_steps: 50
  schedule: "quad"
  is_linear: false

model:
  is_unconditional: 0
  timeemb: 128
  featureemb: 16
  target_strategy: "express4d_condition"
  num_features: 52
  seq_len: 12
  use_duration: false
  duration_embed_dim: 128
  use_condition: true
  condition_embed_dim: 128

loss:
  lambda_recon: 1.0
  lambda_vel: 0.5
  lambda_acc: 0.2
  lambda_range: 0.1
